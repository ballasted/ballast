[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# No global `solc` pin: every existing file already pins its OWN exact
# "pragma solidity 0.8.28;", so auto-detection resolves them to 0.8.28 anyway
# (zero behavior change) — but a global pin disables auto-detection entirely,
# which breaks any file needing a DIFFERENT exact version. BallastRouterV2.sol
# inherits v4-periphery's V4Router.sol, pinned to exactly 0.8.26; a hardcoded
# "0.8.28" here made forge refuse to even consider 0.8.26 as a candidate, with
# the confusing "no solc version exists" error (it exists — the global pin
# just never let auto-detection look for it). Verified: removing this key
# changes nothing about how the 0.8.28 files compile.
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# BallastHook's beforeSwap/afterSwap (calldata-heavy v4 callbacks, now also
# resolving per-pool quote-asset info) hit legacy codegen's stack-too-deep limit —
# the standard fix for hook contracts this shape. forge verify-contract reads this
# same profile, so Blockscout verification picks it up automatically, no extra flag.
via_ir = true
remappings = [
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
    # Uniswap v4 — single core (top-level lib/v4-core) for every EXISTING file
    # (Hook/Factory/Seeder/Buyback*/FeeRouter*/BackingMath — all import the bare
    # "v4-core/" prefix, never "@uniswap/v4-core/"). "@uniswap/v4-core/" is
    # repointed at v4-periphery's OWN bundled copy below, used ONLY by
    # BallastRouterV2.sol (which inherits v4-periphery's V4Router) — that lib
    # requires PoolOperation.sol, absent from the older top-level v4-core pin.
    # No existing file uses this prefix, so this is a zero-blast-radius add,
    # not a version bump of the shared v4-core.
    "@openzeppelin/=lib/v4-core/lib/openzeppelin-contracts/",
    "solmate/=lib/v4-core/lib/solmate/",
    "permit2/=lib/v4-periphery/lib/permit2/",
    "v4-core/=lib/v4-core/",
    "@uniswap/v4-core/=lib/v4-periphery/lib/v4-core/",
    "v4-periphery/=lib/v4-periphery/",
    # Vendored RamsesLocker + its import closure (lib/ramses-v3-contracts,
    # pinned commit in that dir's VENDORED.md) imports "@openzeppelin/contracts/..."
    # at OZ 5.1.0, matching this repo's own top-level lib/openzeppelin-contracts
    # exactly. Scoped to ONLY this path so it can't collide with the existing
    # unscoped "@openzeppelin/" remap above (OZ 5.0.2, used by v4-core/v4-periphery).
    "lib/ramses-v3-contracts/:@openzeppelin/=lib/openzeppelin-contracts/",
]
# Allow the manatee test to read the Python reference SVGs for byte diffing.
# Allow OpenTreasuryVault's ABI-surface test to read its own compiled artifact
# (read-only — proves no admin/rescue function exists by enumerating the real ABI).
fs_permissions = [
    { access = "read", path = "../docs/manatee-svgs-ref" },
    { access = "read", path = "./out" },
]

# Dedicated profile for re-verifying the vendored RamsesLocker's bytecode
# against whatever is actually deployed on-chain. NEVER used by any deploy
# script (those all build under [profile.default] above, unchanged — solc
# auto-detect, optimizer_runs=200). Ramses' own canonical deploy
# (0xF6CD2e03259150D4FF745CDd620c09FBF30DE1dC) used solc 0.8.30, optimizer
# 300 runs, evm cancun, via_ir=true — matched exactly here so
# `FOUNDRY_PROFILE=ramses_verify forge build --contracts src` (or just this
# lib path) reproduces byte-identical output without a separate scratch
# project. See lib/ramses-v3-contracts/VENDORED.md for the full verification
# writeup (immutable-masked diff, CBOR metadata hash explained).
[profile.ramses_verify]
src = "lib/ramses-v3-contracts/contracts"
test = "lib/ramses-v3-contracts/contracts"
script = "lib/ramses-v3-contracts/contracts"
out = "out-ramses-verify"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 300
evm_version = "cancun"
via_ir = true
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
]

# Robinhood Chain — mainnet 4663, testnet 46630. Verify with blockscout.
# See docs/robinhood-chain-research.md for RPCs and the sequencer/oracle gotchas.
[rpc_endpoints]
robinhood_mainnet = "${RH_MAINNET_RPC_URL}"
robinhood_testnet = "${RH_TESTNET_RPC_URL}"

# REMOVED 2026-09-29 — this [etherscan] block was the actual cause of
# "verify-all.sh fails" on every machine, not a network issue. Its mere
# PRESENCE makes `forge verify-contract` print "ETHERSCAN_API_KEY is set,
# defaulting to Etherscan verifier" and silently ignore an explicit
# `--verifier sourcify` (or any non-etherscan verifier) flag entirely —
# confirmed by reproducing it, then removing this block and watching the
# exact same command succeed immediately after. It "worked" for `--verifier
# blockscout` by accident (Blockscout happens to be Etherscan-API-compatible,
# so the wrongly-forced etherscan client still hit the right shape of API at
# the URL given) but broke Sourcify outright (a differently-shaped API). Every
# script that verifies against Blockscout already passes `--verifier
# blockscout --verifier-url <url>` explicitly (see script/verify/*.sh) and
# never needed this shortcut. Do not re-add without testing `--verifier
# sourcify` still works afterward.
#
# [etherscan]
# robinhood_mainnet = { key = "blockscout", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }

